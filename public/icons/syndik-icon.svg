<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SyndicUnion">
  <defs>
    <linearGradient id="su-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="55%" stop-color="#0b5550" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="su-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="su-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.22" />
    </linearGradient>
  </defs>

  <!-- Rounded squircle tile -->
  <rect width="512" height="512" rx="116" fill="url(#su-bg)" />
  <rect x="20" y="20" width="472" height="472" rx="98" fill="none" stroke="url(#su-rim)" stroke-width="6" />

  <!-- Moroccan pointed arch crown -->
  <path
    d="M158 214 C158 152 198 106 256 76 C314 106 354 152 354 214 L322 214 C322 169 294 134 256 112 C218 134 190 169 190 214 Z"
    fill="#ffffff"
  />

  <!-- Architectural pillar capitals -->
  <rect x="108" y="206" width="84" height="24" rx="8" fill="#ffffff" />
  <rect x="320" y="206" width="84" height="24" rx="8" fill="#ffffff" />

  <!-- Subtle Moroccan brass accent bar under capitals -->
  <rect x="122" y="236" width="58" height="10" rx="5" fill="url(#su-gold)" />
  <rect x="332" y="236" width="58" height="10" rx="5" fill="url(#su-gold)" />

  <!-- Outer pillars + unified U-portal -->
  <path
    d="M122 254 H152 V384 H164 V412 H108 V384 H122 Z"
    fill="#ffffff"
  />
  <path
    d="M360 254 H390 V384 H404 V412 H348 V384 H360 Z"
    fill="#ffffff"
  />
  <path
    d="M170 254 H202 V328 C202 360 226 384 256 384 C286 384 310 360 310 328 V254 H342 V328 C342 378 304 416 256 416 C208 416 170 378 170 328 Z"
    fill="#ffffff"
  />

  <!-- Flowing golden S emblem mathematically centered (x=256) inside the U-portal -->
  <path
    d="M292 192 C282 178 270 174 256 174 C232 174 216 190 216 214 C216 244 230 262 246 275 C262 288 268 298 268 314 C268 329 263 336 254 336 C244 336 237 332 231 325 L220 340 C230 354 242 358 256 358 C280 358 296 342 296 318 C296 288 282 270 266 257 C250 244 244 234 244 218 C244 203 249 196 258 196 C268 196 275 200 281 207 Z"
    fill="url(#su-gold)"
  />
</svg>
