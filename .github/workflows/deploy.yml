name: Build and Verify ImmoGest

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Typecheck, Lint, Regression Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies strictly from lockfile
        run: npm ci

      - name: Run TypeScript compiler checks (Frontend & Functions)
        run: npm run typecheck

      - name: Lint Firestore security rules
        run: npm run lint

      - name: Run business logic & security regression checks
        run: npm run test:verify

      - name: Verify payment boundaries
        run: npm run test:business

      - name: Verify identity cache isolation and collision-free journal entries
        run: npm run test:cache

      - name: Verify HTTP identity and authorization boundaries
        run: npm run test:security

      - name: Verify legacy and new assembly snapshot privacy
        run: npm run test:assembly-privacy

      - name: Verify canonical and legacy opening balances
        run: npm run test:opening-balances

      - name: Verify reserve-rate edits and historical payment allocations
        run: npm run test:reserve-rate

      - name: Verify canonical receipt identity and payment allocation limits
        run: npm run test:quittance-integrity

      - name: Verify active building subscription capacity and restoration
        run: npm run test:subscription-capacity

      - name: Verify isolated monthly billing and retry idempotency
        run: npm run test:monthly-billing

      - name: Verify production operations and encrypted recovery
        run: npm run test:production && npm run test:recovery

      - name: Verify Firebase registration, migration, verification, reset and revocation
        run: npm run test:auth

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Firestore persistence and client denial
        run: npm run test:emulator

      - name: Compile Firebase Cloud Functions
        run: npm run build:functions

      - name: Build production frontend bundle
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}

      - name: Install Chromium for form regression tests
        run: npx playwright install --with-deps chromium --only-shell

      - name: Verify Firebase account registration and email verification in Chromium
        run: npm run test:auth:browser

      - name: Verify form focus and resident payment workflow in Chromium
        run: npm run test:ui

      - name: Simulate all roles with Firestore and the Admin Storage SDK
        run: npx firebase emulators:exec --project demo-buildmanage --only firestore "npm run test:ui:cloud"

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: |
            dist/
            dist-server/
          retention-days: 7

