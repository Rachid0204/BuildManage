name: Build and Verify ImmoGest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Typecheck, Lint, Regression Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies strictly from lockfile
        run: npm ci

      - name: Run TypeScript compiler checks (Frontend & Functions)
        run: npm run typecheck

      - name: Lint Firestore security rules
        run: npm run lint

      - name: Run business logic & security regression checks
        run: npm run test:verify

      - name: Verify payment boundaries
        run: npm run test:business

      - name: Verify HTTP identity and authorization boundaries
        run: npm run test:security

      - name: Verify production operations and encrypted recovery
        run: npm run test:production && npm run test:recovery

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Firestore persistence and client denial
        run: npm run test:emulator

      - name: Compile Firebase Cloud Functions
        run: npm run build:functions

      - name: Build production frontend bundle
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}

      - name: Verify compiled production startup and configuration errors
        run: npm run test:startup

      - name: Verify production container serves HTTP without development dependencies
        run: |
          docker build -t immogest-startup .
          container_id=$(docker run -d -p 127.0.0.1:3000:3000 \
            -e PORT=3000 \
            -e SYNDIK_SERVER_SECRET=synthetic-startup-secret-never-use-in-production \
            -e SYNDIK_UPLOAD_BUCKET=demo-startup.invalid \
            -e PUBLIC_APP_URL=https://startup.invalid \
            -e GOOGLE_CLOUD_PROJECT=demo-buildmanage \
            -e FIRESTORE_DATABASE_ID='(default)' \
            -e FIRESTORE_EMULATOR_HOST=127.0.0.1:1 \
            -e GCE_METADATA_DISABLED=true immogest-startup)
          trap 'docker logs "$container_id"; docker rm -f "$container_id" >/dev/null' EXIT
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:3000/api/health
          curl --fail --max-time 3 http://127.0.0.1:3000/ --output /dev/null

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: |
            dist/
            dist-server/
          retention-days: 7
