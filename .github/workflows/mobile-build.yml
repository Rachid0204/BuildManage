name: Build SyndicUnion Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'HTTPS backend API base URL (VITE_API_BASE_URL)'
        required: true
        default: 'https://immogest.cloud.run'
      build_type:
        description: 'Android artifact to build'
        required: true
        type: choice
        default: 'debug-apk'
        options:
          - debug-apk
          - release-aab
          - both
      version_name:
        description: 'Optional Android versionName override (e.g. 1.0.1)'
        required: false
        default: ''
      version_code:
        description: 'Optional Android versionCode integer override (e.g. 2)'
        required: false
        default: ''
      verify_ios_build:
        description: 'Also verify iOS Swift/Xcode simulator compilation on macOS'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: read

jobs:
  android-build:
    name: Build Android APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies strictly from lockfile
        run: npm ci

      - name: Verify mobile CORS, push notifications, and Capacitor shell config
        run: npm run test:mobile && npm run test:capacitor

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure optional Firebase google-services.json
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "$GOOGLE_SERVICES_B64" | base64 --decode > android/app/google-services.json
            echo "Loaded android/app/google-services.json from repository secret."
          else
            echo "ANDROID_GOOGLE_SERVICES_JSON_BASE64 not set; building without FCM native config."
          fi

      - name: Apply optional Android version overrides
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
        run: |
          node -e '
            const fs = require("node:fs");
            const file = "android/app/build.gradle";
            let text = fs.readFileSync(file, "utf8");
            const vName = (process.env.VERSION_NAME || "").trim();
            const vCode = (process.env.VERSION_CODE || "").trim();
            if (vName && /^[0-9A-Za-z._-]+$/.test(vName)) {
              text = text.replace(/versionName\s+"[^"]+"/, `versionName "${vName}"`);
            }
            if (vCode && /^\d+$/.test(vCode)) {
              text = text.replace(/versionCode\s+\d+/, `versionCode ${Number(vCode)}`);
            }
            fs.writeFileSync(file, text);
          '

      - name: Build mobile web bundle and sync Android project
        run: npm run mobile:build:android
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://immogest.cloud.run' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}

      - name: Assemble Debug APK (sideloadable test build)
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'debug-apk' || github.event.inputs.build_type == 'both' }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload SyndicUnion Debug APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'debug-apk' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: SyndicUnion-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Build Release AAB (Google Play Bundle)
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'release-aab' || github.event.inputs.build_type == 'both' }}
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/syndicunion-release.jks"
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            ./gradlew bundleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            rm -f "$KEYSTORE_PATH"
          else
            echo "::notice::Signing secrets not configured; building unsigned release AAB."
            ./gradlew bundleRelease --no-daemon
          fi

      - name: Upload SyndicUnion Release AAB
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'release-aab' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: SyndicUnion-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

  ios-verify:
    name: Verify iOS Xcode Compilation (Simulator)
    if: ${{ github.event_name == 'push' || github.event.inputs.verify_ios_build == true }}
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies strictly from lockfile
        run: npm ci

      - name: Build mobile web bundle and sync iOS project
        run: npm run mobile:build:ios
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://immogest.cloud.run' }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DATABASE_ID: ${{ secrets.VITE_FIRESTORE_DATABASE_ID }}

      - name: Compile iOS App for Simulator (unsigned CI verification)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
